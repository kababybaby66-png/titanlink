                                                                [package]
name = "titanlink-relay"
version = "0.1.0"
edition = "2021"
description = "Ultra-lightweight UDP relay server for TitanLink (Oracle VM deployment)"
license = "MIT"

[[bin]]
name = "titanlink-relay"
path = "src/main.rs"

[dependencies]
# Async runtime
tokio = { version = "1", features = ["rt-multi-thread", "net", "sync", "time", "macros"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# Utilities
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.release]
lto = true
opt-level = "z"  # Optimize for size (smallest binary for Oracle VM)
strip = true
codegen-units = 1
panic = "abort"
