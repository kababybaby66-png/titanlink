[package]
name = "titanlink-capture"
version = "0.1.0"
edition = "2021"
description = "Ultra-low latency screen capture with DXGI + NVENC for TitanLink"
license = "MIT"

[lib]
crate-type = ["cdylib"]

[dependencies]
# Node.js bindings
napi = { version = "2", features = ["async", "napi8", "serde-json"] }
napi-derive = "2"

# Windows APIs for DXGI Desktop Duplication
[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_System_Threading",
    "Win32_System_LibraryLoader",
    "Win32_Security",
    # WASAPI audio capture
    "Win32_Media_Audio",
    "Win32_System_Com",
    "Win32_Networking_WinSock",
]}

# Async runtime for threaded capture
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time"] }

# Error handling
thiserror = "1.0"
anyhow = "1.0"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[build-dependencies]
napi-build = "2"

[profile.release]
lto = true
opt-level = 3
codegen-units = 1
